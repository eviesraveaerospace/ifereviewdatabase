<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAVE Aerospace — IFE ReviewDB</title>
<style>
:root{
  --ink:#0d0d0d;--ink2:#3a3a3a;--gray:#6b6b6b;--gray2:#9a9a9a;--gray3:#cbcbcb;
  --bg:#f1f1f1;--soft:#f9f9f9;--soft2:#fbfbfb;--line:rgba(0,0,0,.14);--line2:rgba(0,0,0,.22);
  --red:#e8242a;--red-bg:#fff5f4;--red-ink:#d64a44;
  --green:#16a34a;--green-bg:#f0fdf4;--blue:#2563eb;
  --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:var(--f);cursor:pointer;background:none;border:none}
svg{display:block}
.hide{display:none!important}

.wrap{display:flex;gap:28px;padding:24px 56px;max-width:2400px;margin:0 auto;align-items:flex-start}

/* sidebar */
.side{width:236px;flex-shrink:0;position:sticky;top:26px;display:flex;flex-direction:column;gap:32px}
.logo{line-height:1}
.logo-img{width:184px;height:auto;display:block}
.logo .r{font-size:24px;font-weight:800;color:var(--red);letter-spacing:1px}
.logo .a{font-size:8px;font-weight:500;letter-spacing:2px;color:var(--ink);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-i{display:flex;align-items:center;gap:15px;padding:14px 17px;border-radius:12px;font-size:15px;color:var(--ink);width:100%;text-align:left}
.nav-i:hover{background:var(--soft)}
.nav-i.on{background:#fff;box-shadow:1px 1px 2px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.04);font-weight:500}
.nav-i .gi{width:22px;display:flex;justify-content:center;color:var(--ink);flex-shrink:0}
.nav-dots{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:20px}
.nav-dots i{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:30px;font-weight:500;letter-spacing:-.01em}
.top .acts{display:flex;align-items:center;gap:12px}
.pill-btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 24px;border-radius:73px;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.pill-btn:hover{opacity:.9}
.ico-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ico-btn:hover{background:var(--soft)}

.cols{display:flex;gap:18px;align-items:flex-start}
.col-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-r{width:326px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.col-r .cmts{display:flex;flex-direction:column;min-height:0}
@media(max-width:1080px){.cols{flex-direction:column}.col-r{width:100%}}

/* frames */
.frame{border:1px solid var(--line2);border-radius:28px;background:#fff}
.frame.pad{padding:30px 34px}
.card{border:1px solid var(--line2);border-radius:18px;background:#fff}

/* overview */
.ov-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.ov-h .t{font-size:23px;font-weight:400}
.sel{display:inline-flex;align-items:center;gap:7px;height:43px;border:1px solid var(--line2);border-radius:29px;padding:0 16px;font-size:15px;color:var(--ink);background:#fff}
.sel select{border:none;outline:none;background:none;font-family:var(--f);font-size:15px;color:var(--ink);cursor:pointer}
.stats{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.stat{flex:1;min-width:240px;background:#fff;border-radius:18px;box-shadow:0 2px 2px rgba(0,0,0,.10);padding:26px 30px}
.stat.plain{box-shadow:none;background:transparent}
.stat .lb{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink)}
.stat .lb .gi{color:var(--ink)}
.stat .row{display:flex;align-items:center;gap:14px;margin-top:14px}
.stat .v{font-size:48px;font-weight:400;line-height:1;letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;font-size:12.5px}
.badge.down{background:var(--red-bg);color:var(--red-ink);border:1px solid #f3ddda}
.badge.up{background:var(--green-bg);color:var(--green);border:1px solid #cdeed6}
.badge.flat{background:var(--soft);color:var(--gray);border:1px solid var(--line)}
.vs{font-size:12px;color:var(--ink);margin-top:5px;max-width:80px;line-height:1.3}

.ov-sub{font-size:18px;margin:34px 0 20px}
.chans{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chan{display:flex;flex-direction:column;align-items:center;gap:10px;width:64px}
.chan .av{width:56px;height:56px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#555}
.chan .nm{font-size:14px;text-align:center;line-height:1.25;max-width:74px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.chan .va{width:56px;height:54px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink)}

/* most recent */
.sec-h{display:flex;align-items:center;gap:6px}
.sec-h .t{font-size:16px}
.sortdd{position:relative}
.sortdd-b{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 15px;border:1px solid var(--line2);border-radius:21px;background:#fff;font-family:var(--f);font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.sortdd-b:hover{border-color:#c9c9c9;background:var(--soft)}
.sortdd-b.open{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.sortdd-b svg{color:var(--gray);transition:transform .18s}
.sortdd-b.open svg{transform:rotate(180deg)}
.sortdd-p{position:absolute;top:calc(100% + 6px);left:0;min-width:196px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.13);padding:6px;z-index:40;animation:ddin .13s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sortdd-o{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;padding:9px 12px;border:none;border-radius:9px;background:none;font-family:var(--f);font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
.sortdd-o:hover{background:var(--soft)}
.sortdd-o svg{color:var(--red);opacity:0;flex:none}
.sortdd-o.on{font-weight:600}
.sortdd-o.on svg{opacity:1}
.rlist{padding:12px}
/* YouTube-style video rows */
.ritem{display:flex;gap:14px;padding:8px;border-radius:12px;cursor:pointer;transition:background .12s}
.ritem+.ritem{margin-top:4px}
.ritem:hover{background:#f2f2f2}
.rthumb{width:168px;height:94px;border-radius:12px;background:#e5e5e5;flex-shrink:0;overflow:hidden;position:relative}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rthumb.art{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#9a9a9a}
.rthumb.doc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fbfaf6;border:1px solid var(--line2);color:#8a8172}
.rthumb.doc .dom{max-width:88%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.rthumb .artbadge{position:absolute;top:6px;left:6px;background:#fff;border:1px solid var(--line2);color:#7a6a3f;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:4px}
.rthumb .cc{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rtt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3;color:#0f0f0f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtags{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.rsub{font-size:12px;color:#606060}
.rex{font-size:12px;color:#606060;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;color:#0f0f0f;white-space:nowrap;background:var(--soft)}
.tag.soft{border-color:var(--line2);color:var(--ink2);background:#fff}
.tag.note{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
/* modal notes */
.mnotes{margin:0 20px 22px;border-top:1px solid var(--line);padding-top:16px}
.mn-h{font-size:13px;font-weight:700;margin-bottom:10px}
.mn-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:220px;overflow-y:auto}
.mn-empty{font-size:12px;color:var(--gray)}
.mn-i{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.mn-meta{font-size:11px;color:var(--gray);margin-bottom:3px}.mn-meta b{color:var(--ink)}
.mn-tx{font-size:13px;line-height:1.5;color:var(--ink2);white-space:pre-wrap}
.mn-add{display:flex;flex-direction:column;gap:8px}
.mn-in,.mn-ta{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--f);outline:none;color:var(--ink)}
.mn-in{font-size:12px}.mn-ta{resize:vertical;min-height:56px;line-height:1.5}
.mn-in:focus,.mn-ta:focus{border-color:var(--red)}
.mn-btn{align-self:flex-start;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
.mn-btn:disabled{opacity:.5}
/* multi-select facet filters */
.fdd{position:relative}
.fdd-b{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:11px 16px;border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-weight:500;font-family:var(--f);cursor:pointer}
.fdd-b:hover{border-color:var(--gray2)}
.fdd-b.on{border-color:var(--red);color:var(--red);background:#fff5f4}
.fdd-n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:17px;text-align:center}
.fdd-p{position:absolute;top:calc(100% + 6px);left:0;z-index:200;width:244px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:8px}
.fdd-p.hide{display:none}
.fdd-s{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;font-family:var(--f);outline:none;margin-bottom:6px}
.fdd-s:focus{border-color:var(--red)}
.fdd-list{display:flex;flex-direction:column;gap:1px;max-height:230px;overflow-y:auto}
.fdd-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--ink2);cursor:pointer;text-transform:capitalize}
.fdd-i:hover{background:var(--soft)}
.fdd-i input{accent-color:var(--red);cursor:pointer;flex-shrink:0}
.fbtn.clr{border-color:transparent;color:var(--gray);background:none}
.fbtn.clr:hover{color:var(--red)}
.active-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.active-filters:empty{display:none}
.afl-lbl{font-size:14px;color:var(--gray);font-weight:600}
.afl{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:8px 15px;border-radius:999px;background:#fff5f4;border:1px solid #f0cdd1;color:var(--red);cursor:pointer;text-transform:capitalize}
.afl b{font-weight:700;opacity:.6;font-size:16px}
.afl:hover{background:#ffe6e2}.afl:hover b{opacity:1}
.afl-clr{font-size:13px;color:var(--gray);background:none;border:none;cursor:pointer;text-decoration:underline;margin-left:4px}
.afl-clr:hover{color:var(--red)}
@media(max-width:640px){.rthumb{width:120px;height:68px}.rtags{max-width:40%}}

/* new videos feed: show the whole timeframe, scrolling within the card */
#recent{max-height:66vh;overflow-y:auto;overscroll-behavior:contain}

/* popular features */
.pf{padding:16px 12px 18px 16px}
.pf .t{font-size:20px;margin-bottom:14px}
.featbar{display:flex;align-items:center;gap:10px;width:100%;padding:11px 8px;border-radius:10px;cursor:pointer;background:none;border:none;font-family:var(--f);text-align:left}
.featbar:hover{background:var(--soft)}
.featbar .fbl{font-size:13px;color:var(--ink2);width:118px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.featbar:hover .fbl{color:var(--red)}
.featbar .fbar{flex:1;height:8px;border-radius:999px;background:#ececec;overflow:hidden}
.featbar .fbar>span{display:block;height:100%;border-radius:999px;background:var(--red)}
.featbar .fbv{font-size:12px;font-weight:600;color:var(--ink2);width:36px;text-align:right}
.all-btn{margin-top:14px;width:100%;height:47px;border:1px solid #818181;border-radius:65px;color:#616161;font-size:15px}
.all-btn:hover{background:var(--soft)}

/* comments */
.cmts{padding:16px 18px 22px}
.cmts .t{font-size:18px;margin-bottom:20px}
.cmt{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.cmt+.cmt{margin-top:20px}
.cmt .hd{display:flex;gap:14px;align-items:center}
.cmt .av{width:41px;height:41px;border-radius:50%;background:#d9d9d9;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#555}
.cmt .hd{display:flex;gap:14px;align-items:flex-start}
.cmt .hmeta{flex:1;min-width:0}
.cmt .who{font-size:15px;display:flex;align-items:center;gap:8px}.cmt .tm{font-size:12px;color:var(--gray);margin-top:3px}
.cmt .tx{font-size:12.5px;line-height:1.55;color:var(--ink2);margin-top:10px}
.cmt:hover .who{color:var(--red)}
.cmt-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--gray);border:1px solid var(--line)}
.cmt-tag.ch{background:var(--red-bg);color:var(--red-ink);border-color:#f3ddda}
.cmt-orig{display:block;margin-top:5px;font-size:11px;color:var(--gray);font-style:normal}.cmt-orig em{font-style:normal;opacity:.7}
.cmt-lk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gray);flex:none;margin-top:2px}
.cmt-lk svg{fill:var(--gray);stroke:none}

/* statistics */
.stitle{font-size:20px;margin:0 0 6px}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.an{border:1px solid var(--line2);border-radius:18px;background:#fff;padding:18px 20px}
.an.full{grid-column:1/-1}
.an h3{font-size:16px;font-weight:600;margin-bottom:16px}
.an .t11,.tbl .t11{font-size:13px}
.an-note{font-size:13px;color:var(--gray);margin:-8px 0 14px;line-height:1.55}
.trend{display:flex;align-items:flex-end;gap:12px;height:120px}
.trend .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
.trend .bar{width:100%;max-width:40px;border-radius:4px 4px 0 0}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.hbar .hl{font-size:13px;color:var(--ink2);width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{flex:1;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.hbar .track>span{display:block;height:100%;border-radius:999px}
.hbar .hv{font-size:13px;font-weight:600;color:var(--ink2);width:44px;text-align:right}
.tbl{border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:#fff}
.tbl .rh,.tbl .tr{display:grid;align-items:center;padding:12px 16px}
.tbl .rh{background:var(--soft);border-bottom:1px solid var(--line)}
.tbl .rh span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gray2)}
.tbl .tr:not(:last-child){border-bottom:1px solid var(--line)}
.tbl .tr:hover{background:var(--soft2)}
.tbl .tr[data-sys],.tbl .tr[data-air],.tbl .tr[data-chan],.hbar[data-sys],.hbar[data-feat]{cursor:pointer}
.hbar[data-sys]:hover .hl,.hbar[data-feat]:hover .hl{color:var(--red)}
.tbl .t12{font-size:13.5px}
.sbar{display:flex;height:4px;border-radius:999px;overflow:hidden;background:#f0f0f0;width:100%}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.status .d{width:6px;height:6px;border-radius:50%}

/* filters + pagination */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.searchbar{margin-bottom:12px}
.rsearch{position:relative;width:100%}
.rsearch input{width:100%;height:48px;padding:0 44px 0 46px;border:1px solid var(--line2);border-radius:12px;font-family:var(--f);font-size:15px;color:var(--ink);background:#fff;outline:none}
.rsearch input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.rsearch .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gray);display:flex}
.rsearch .sx{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gray);cursor:pointer;font-size:18px;line-height:1;display:none;border:none;background:none;padding:2px}
.rsearch.has .sx{display:block}
.fbtn{font-size:11px;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);color:var(--gray)}
.fbtn.on{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
.pgbar{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 0}
.pgb{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;font-size:12px;color:var(--ink2);font-weight:500}
.pgb.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.pgb:disabled{opacity:.4}
.state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px;color:var(--gray)}
.spin{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.t11{font-size:11px;color:var(--gray)}

/* modal + chat (shared) */
.mback,.chat-back{position:fixed;inset:0;background:rgba(13,13,13,.5);z-index:1000;display:none}
.mback.show{display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:1500px;width:95vw;margin:auto;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.mx{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:15px;z-index:5}
.mbody{display:flex;flex-wrap:wrap}
.mmain{flex:1 1 900px;min-width:0}
.mplayer{aspect-ratio:16/9;background:#000;max-height:80vh}.mplayer iframe{width:100%;height:100%;border:none}
.mplayer-wrap.short{background:#000;display:flex;justify-content:center}.mplayer.short{aspect-ratio:9/16;height:min(80vh,720px);width:auto;max-width:100%;margin:0 auto}
.tag.short{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.article-body{padding:4px 20px 18px;font-size:14px;line-height:1.7;color:var(--ink2)}.article-body p{margin:0 0 12px}.article-body h3{font-size:15px;margin:18px 0 8px;color:var(--ink)}.article-body p.ife{background:#fff7e6;border-left:3px solid #e0a800;padding:8px 12px;border-radius:0 6px 6px 0;color:var(--ink)}.article-body mark{background:#ffe08a;color:inherit;padding:0 2px;border-radius:2px}.article-body .ab-h{font-size:10px;font-weight:700;letter-spacing:.14em;color:#9a8f76;margin:14px 0 8px}.article-body .ab-empty{font-size:12.5px;color:var(--gray)}.mside.short .cap-all{font-size:12px;color:var(--ink2);line-height:1.6;white-space:pre-wrap}
.mhead{aspect-ratio:21/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff}

/* ── flagged videos (localStorage) — personal "reference later" list ── */
// Map keyed by review URL -> {url,title,channel,year,ts}. Stored SERVER-SIDE
// (flags.json) so saves survive browser/device/address changes.
let FLAGS={};
function postFlag(f,on){fetch('/api/flags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...f,on})}).catch(()=>{});}
async function loadFlags(){
  try{const d=await (await fetch('/api/flags')).json();if(d.status==='success')FLAGS=d.flags||{};}catch{}
  // one-time migration of old browser-local bookmarks to the server
  try{
    const legacy=JSON.parse(localStorage.getItem('rave-flags')||'{}');
    Object.values(legacy).forEach(f=>{if(f&&f.url&&!FLAGS[f.url]){FLAGS[f.url]=f;postFlag(f,true);}});
    if(Object.keys(legacy).length)localStorage.removeItem('rave-flags');
  }catch{}
  refreshAlerts();
  return FLAGS;
}
function isFlagged(url){return !!(url&&FLAGS[url]);}
function flagCount(){return Object.keys(FLAGS).length;}
function toggleFlag(r){
  const url=r&&r.url;if(!url)return false;
  if(FLAGS[url]){const f=FLAGS[url];delete FLAGS[url];postFlag(f,false);}
  else{FLAGS[url]={url,title:dispTitle(r),channel:r.channel_title||r.source_name||'Creator',year:r.year||'',ts:Date.now()};postFlag(FLAGS[url],true);}
  refreshAlerts();return isFlagged(url);
}
function refreshAlerts(){
  const b=$('alertBadge');if(!b)return;
  const n=flagCount();
  if(n>0){b.textContent=n;b.classList.remove('hide');}else b.classList.add('hide');
}
function renderAlertPanel(){
  const p=$('alertPanel');if(!p)return;
  const items=Object.values(FLAGS).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!items.length){p.innerHTML='<div class="ap-empty">No saved videos yet.<br>Click the bookmark on any video to save it here for later.</div>';return;}
  p.innerHTML='<div class="ap-h"><span>Saved videos ('+items.length+')</span><button id="apClear">Clear all</button></div>'+
    items.map(it=>'<div class="ap-i" data-u="'+esc(it.url)+'"><span class="ap-nm">'+esc(it.title)+'<span class="ap-ty">'+esc(cap(it.channel))+(it.year?' · '+it.year:'')+'</span></span><button class="ap-x" data-rm="'+esc(it.url)+'" title="Remove">✕</button></div>').join('');
  p.querySelectorAll('.ap-i').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('.ap-x'))return;
    const u=el.dataset.u;if(u){p.classList.add('hide');openReviewByUrl(u);}
  }));
  p.querySelectorAll('.ap-x').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const u=b.dataset.rm;if(FLAGS[u]){postFlag(FLAGS[u],false);delete FLAGS[u];}refreshAlerts();renderAlertPanel();refreshFlagIcons();}));
  const cl=$('apClear');if(cl)cl.addEventListener('click',()=>{Object.values(FLAGS).forEach(f=>postFlag(f,false));FLAGS={};refreshAlerts();renderAlertPanel();refreshFlagIcons();});
}
function toggleAlerts(){const p=$('alertPanel');if(p.classList.contains('hide')){renderAlertPanel();p.classList.remove('hide');}else p.classList.add('hide');}

function refreshFlagIcons(){document.querySelectorAll('.flagbtn[data-fu]').forEach(b=>b.classList.toggle('on',isFlagged(b.dataset.fu)));}

/* ── shareable URL state ── */
function syncURL(){
  const p=new URLSearchParams();p.set('tab',TAB);
  if(TAB==='Reviews'){
    if(S.channelFilter)p.set('channel',S.channelFilter);
    if(S.searchQ)p.set('q',S.searchQ);
    FACETS.forEach(([k])=>{if(S.filters[k].size)p.set(k,[...S.filters[k]].join(','));});
  }
  if(TAB==='Compare'){if(S.cmpA)p.set('a',S.cmpA);if(S.cmpB)p.set('b',S.cmpB);}
  history.replaceState(null,'','?'+p.toString());
}
function restoreURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('channel')){S.channelFilter=p.get('channel');S.channelLabel=p.get('channel');}
  if(p.get('q'))S.searchQ=p.get('q');
  FACETS.forEach(([k])=>{const v=p.get(k);if(v)v.split(',').forEach(x=>x&&S.filters[k].add(x));});
  if(p.get('a'))S.cmpA=p.get('a');
  if(p.get('b'))S.cmpB=p.get('b');
  return p.get('tab');
}

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cap(s){return (s||'').replace(/\b\w/g,c=>c.toUpperCase());}
function fmtN(n){return (n||0).toLocaleString();}
function fmtV(n){if(!n)return null;if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}
function ini(s){const w=(s||'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase();}
function host(u){try{return new URL(u||'').hostname.replace(/^www\./,'');}catch{return '';}}
function ytId(u){try{const x=new URL(u);if(x.hostname.includes('youtube.com'))return x.searchParams.get('v');if(x.hostname==='youtu.be')return x.pathname.slice(1);}catch{}return null;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
// English title when a translation exists (translate_captions.py), else original.
function dispTitle(r){return r.title_en||r.title||'Untitled';}

async function loadReviews(page){
  let d;
  if(anyFilter()){
    const body={...activeFacets(),page};
    if(S.searchQ)body._search=S.searchQ;
    if(S.channelFilter)body._channel=S.channelFilter;
    d=await (await fetch('/api/ife-filter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  } else d=await (await fetch('/api/ife-reviews?page='+page)).json();
  if(d.status==='success'){S.reviews=d.rows||[];S.summary=d.summary||{};S.page=d.page;S.totalPages=d.total_pages;S.total=d.total;}
  return d;
}

async function loadChannels(){if(S.channels)return S.channels;try{const d=await (await fetch('/api/channels')).json();if(d.status==='success')S.channels=d.channels;}catch{}return S.channels||[];}
async function loadComments(){if(S.comments)return S.comments;try{const d=await (await fetch('/api/comments')).json();if(d.status==='success')S.comments=d.comments;}catch{}return S.comments||[];}
async function loadNotes(){try{const d=await (await fetch('/api/notes')).json();if(d.status==='success')S.notes=d.notes||{};}catch{}return S.notes;}
function fmtDate(ts){try{return new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return ts||'';}}

function fmtLikes(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n);}
async function renderComments(){
  const cb=$('cmts');if(!cb)return;

function setTab(tab){
  // Leaving the Reviews tab resets everything set there (facets, search, channel)
  // so the next visit starts clean.
  if(TAB==='Reviews'&&tab!=='Reviews'){FACETS.forEach(([k])=>S.filters[k].clear());S.searchQ='';S.channelFilter='';S.channelLabel='';S.page=1;}
  TAB=tab;$('pageTitle').textContent=tab;

// One comparative metric row: label + two bars scaled to the larger value; winner highlighted.
function cmpBar(label,va,vb,fmt,hint){
  const max=Math.max(va||0,vb||0,1);
  const pa=Math.round((va||0)/max*100),pb=Math.round((vb||0)/max*100);
  const aWin=va>vb,bWin=vb>va;
  const cell=(v,p,win,side)=>'<div class="cb-cell '+side+'">'
    +'<div class="cb-val'+(win?' win':'')+'">'+fmt(v)+(win?' <span class="cb-crown">▲</span>':'')+'</div>'
    +'<div class="cb-track"><div class="cb-fill '+side+(win?' win':'')+'" style="width:'+p+'%"></div></div></div>';
  return '<div class="cb-row"><div class="cb-lbl">'+esc(label)+(hint?'<span class="cb-hint">'+esc(hint)+'</span>':'')+'</div>'
    +cell(va,pa,aWin,'a')+cell(vb,pb,bWin,'b')+'</div>';
}
function cmpHead(s,side){
  const st=s.status==='Active'?'#16a34a':'#d97706';
  return '<div class="cmp-h '+side+'"><div class="cmp-h-top"><span class="cmp-side '+side+'">'+side.toUpperCase()+'</span>'+starBtn('systems',s.name,s.reviews)+'</div>'
    +'<div class="cmp-nm">'+esc(s.name)+'</div><div class="t11">'+esc(s.vendor)+'</div>'
    +'<div class="cmp-status" style="color:'+st+'"><span class="d" style="background:'+st+'"></span>'+s.status+'</div></div>';
}
function pctFmt(v){return v==null?'—':(v>=0?'+':'')+v+'%';}
function paintCompare(){
  const sys=(S.agg&&S.agg.systems)||[];
  const a=sys.find(s=>s.name===S.cmpA),b=sys.find(s=>s.name===S.cmpB);
  const body=$('cmpBody');if(!body)return;
  if(!a||!b){body.innerHTML='<div class="state">Pick two systems.</div>';return;}
  const ma=cmpMomentum(a.name),mb=cmpMomentum(b.name);

  // metric bars
  const bars=
    cmpBar('Reviews',a.reviews,b.reviews,fmtN,'coverage')+
    cmpBar('Reach (views)',a.views,b.views,fmtV,'total audience')+
    cmpBar('Avg likes / video',a.avg_likes||0,b.avg_likes||0,v=>v?'~'+fmtV(v):'—','engagement')+
    ((ma!=null||mb!=null)?cmpBar('Momentum YoY',ma||0,mb||0,pctFmt,'vs last year'):'');

  // feature diff matrix
  const rows=CMP_FEATURES.map(f=>{
    const ha=(a.features||[]).includes(f),hb=(b.features||[]).includes(f);
    const both=ha&&hb;
    const mk=(has)=>has?'<span class="fx-y">✓</span>':'<span class="fx-n">✗</span>';
    return '<div class="fx-row'+(both?' both':'')+'"><div class="fx-lbl">'+esc(FEAT_LABELS[f]||f)+'</div>'
      +'<div class="fx-c">'+mk(ha)+'</div><div class="fx-c">'+mk(hb)+'</div></div>';
  }).join('');
  const acount=(a.features||[]).length,bcount=(b.features||[]).length;

  // airline / aircraft overlap
  const setA=new Set(a.airlines||[]),setB=new Set(b.airlines||[]);
  const shAir=[...setA].filter(x=>setB.has(x));
  const upA=(a.airlines||[]).filter(x=>!setB.has(x)),upB=(b.airlines||[]).filter(x=>!setA.has(x));
  const tagList=(arr,cls)=>arr.length?arr.map(x=>'<span class="gtag '+(cls||'')+'">'+esc(cap(x))+'</span>').join(''):'<span class="t11">—</span>';

  body.innerHTML=
    '<div class="cmp-heads">'+cmpHead(a,'a')+'<div class="cmp-vs-mid">VS</div>'+cmpHead(b,'b')+'</div>'+
    '<div class="cmp-panel"><div class="cmp-panel-t">Metrics</div>'+bars+'</div>'+
    '<div class="cmp-panel"><div class="cmp-panel-t">Feature coverage <span class="t11">— '+acount+' vs '+bcount+' features</span></div>'+
      '<div class="fx"><div class="fx-row fx-head"><div class="fx-lbl">Feature</div><div class="fx-c">'+esc(shortName(a.name))+'</div><div class="fx-c">'+esc(shortName(b.name))+'</div></div>'+rows+'</div></div>'+
    '<div class="cmp-panel"><div class="cmp-panel-t">Airlines</div>'+
      '<div class="cmp-ov"><div><div class="cmp-k">Shared ('+shAir.length+')</div><div class="cmp-tags">'+tagList(shAir)+'</div></div>'+
      '<div><div class="cmp-k">Only '+esc(shortName(a.name))+'</div><div class="cmp-tags">'+tagList(upA,'soft')+'</div></div>'+
      '<div><div class="cmp-k">Only '+esc(shortName(b.name))+'</div><div class="cmp-tags">'+tagList(upB,'soft')+'</div></div></div></div>';
  wireStars();
}

function wireSysEdit(r){
  const btn=$('sysEdit');if(!btn)return;
  btn.addEventListener('click',async()=>{
    const opts=await loadFilterOpts();
    const systems=((opts&&opts.ife_systems)||[]).slice().sort();
    const sel=document.createElement('select');sel.className='sys-sel';
    sel.innerHTML='<option value="">— no system —</option>'+systems.map(s=>'<option value="'+esc(s)+'"'+(s===r.ife_system?' selected':'')+'>'+esc(s)+'</option>').join('');
    btn.replaceWith(sel);sel.focus();
    let done=false;
    const save=async()=>{
      if(done)return;done=true;
      const v=sel.value;
      if((v||null)!==(r.ife_system||null)){
        try{
          const d=await(await fetch('/api/review-system',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:r.url,system:v})})).json();
          if(d.status==='success'){r.ife_system=v||null;r.ife_system_manual=true;S.agg=null;toast(v?'System set to '+v:'System tag cleared');}
          else toast(d.error||'Could not save.');
        }catch{toast('Network error.');}
      }
      const el=$('mChips');if(el){el.innerHTML=chipsHTML(r);wireSysEdit(r);}
    };
    sel.addEventListener('change',save);
    sel.addEventListener('blur',save);
  });
}

const IFE_HL_RE=/(in-?\s?flight entertainment(?: (?:and|&) connectivity)?|inflight entertainment|\bIFEC?\b|seat-?back(?: screens?| displays?| monitors?| tvs?)?|entertainment (?:system|screen|library|options?|selection|offering|content|choices)|touch-?screens?|personal (?:screens?|tvs?)|\bICE\b(?= system| entertainment)|noise-?cancell?ing headphones|headphones? jack|streaming entertainment|wireless (?:ife|entertainment|streaming)|(?:in-?flight|on-?board) wi-?fi|moving map|live tv|content library)/gi;
const IFE_HL_TEST=new RegExp(IFE_HL_RE.source,'i');
const ART_JUNK_RE=/^(copyright|©|all rights reserved|this site is owned|cookie|privacy policy|terms of (use|service)|subscribe|sign up|newsletter|advertisement|related:|read more:|share this|follow us|photo:|image:|credit:)/i;

// Parse article paragraphs into sections (heading + paragraphs) and flag the ones that talk about IFE.
function parseArticleSections(paras){
  const clean=(paras||[]).map(t=>String(t||'').trim()).filter(t=>t&&!ART_JUNK_RE.test(t)&&!/^\d{1,2}$/.test(t));
  const secs=[];let cur={heading:null,paras:[]};
  clean.forEach(t=>{
    const isHead=t.length<90&&!/[.!?…]$/.test(t)&&t.split(/\s+/).length<=14;
    if(isHead){if(cur.heading||cur.paras.length)secs.push(cur);cur={heading:t,paras:[]};}
    else cur.paras.push(t);
  });
  if(cur.heading||cur.paras.length)secs.push(cur);
  secs.forEach(sec=>{sec.hits=sec.paras.filter(t=>IFE_HL_TEST.test(t)).length;sec.ife=sec.hits>0||!!(sec.heading&&IFE_HL_TEST.test(sec.heading));});
  return secs;
}
const hl=t=>esc(t).replace(IFE_HL_RE,'<mark>$1</mark>');
// Article body: the article itself, with IFE sections highlighted and the phrases marked.
function articleBodyHTML(r,ifeOnly){
  const secs=parseArticleSections(r.article_text);
  if(!secs.length)return '<div class="article-body"><div class="ab-empty">The article text could not be fetched for inline display — use “Open article” to read it on the publisher’s site.</div></div>';
  const nIfe=secs.reduce((a,x)=>a+x.hits,0),nAll=secs.reduce((a,x)=>a+x.paras.length,0);
  const shown=ifeOnly?secs.filter(x=>x.ife):secs;
  const body=shown.map(sec=>{
    const h=sec.heading?'<h3'+(sec.ife?' class="ife"':'')+'>'+(sec.ife?'✦ ':'')+hl(sec.heading)+'</h3>':'';
    const ps=ifeOnly?sec.paras.filter(t=>IFE_HL_TEST.test(t)):sec.paras;
    return h+ps.map(t=>'<p'+(IFE_HL_TEST.test(t)?' class="ife"':'')+'>'+hl(t)+'</p>').join('');
  }).join('')||'<div class="ab-empty">No IFE mentions were found in this article.</div>';
  return '<div class="article-body"><div class="ab-bar"><span class="ab-h">'+(nIfe?nIfe+' of '+nAll+' paragraphs mention IFE':'No IFE mentions found')+'</span>'+
    (nIfe?'<span class="ab-tog"><button class="ab-t'+(ifeOnly?' on':'')+'" data-mode="ife">IFE only</button><button class="ab-t'+(!ifeOnly?' on':'')+'" data-mode="all">Full article</button></span>':'')+'</div>'+body+'</div>';
}
function wireArticleFrame(r){
  const f=$('artFrame');if(!f)return;
  const fallback=()=>{const host=$('mArt');if(!host)return;host.innerHTML='<div class="ab-empty" style="padding:12px 20px 4px">The publisher’s page could not be embedded — showing the saved text instead.</div>'+articleBodyHTML(r,false);};
  f.addEventListener('load',()=>{let doc=null;try{doc=f.contentDocument;}catch(e){}if(!(doc&&doc.querySelector('meta[name="ife-preview"]')))fallback();});
  f.addEventListener('error',fallback);
}
function wireArticleToggle(r){
  const host=$('mArt');if(!host)return;
  host.querySelectorAll('.ab-t').forEach(b=>b.addEventListener('click',()=>{S.artIfeOnly=b.dataset.mode==='ife';localStorage.setItem('rave-art-ife',S.artIfeOnly?'1':'0');host.innerHTML=articleBodyHTML(r,S.artIfeOnly);wireArticleToggle(r);}));
}
function openModal(idx,rows){
  $('mback').classList.remove('feat');
  S.mRows=rows||S.reviews;S.mIdx=idx;const r=S.mRows[idx];if(!r)return;
  const isVid=r.media_type==='video',isInternal=r.media_type==='internal',vid=isVid?ytId(r.url):null;
  const isShort=isShortRow(r),isArt=!isVid&&!isInternal;
  const channel=r.channel_title||r.source_name||'Creator';
  const sub=[channel,isVid&&fmtV(r.view_count)?fmtV(r.view_count)+' views':null,(isInternal&&r.internal_rating)?('★'.repeat(r.internal_rating)+'☆'.repeat(5-r.internal_rating)):null,r.year||null].filter(Boolean).join(' · ');
  let main='<div class="mmain'+(isArt?' art':'')+'">';
  if(isArt){
    // Article: a slim toolbar, then the article preview itself with IFE sections highlighted.
    if(S.artIfeOnly==null)S.artIfeOnly=localStorage.getItem('rave-art-ife')==='1';
    main+='<div class="art-top"><div class="art-src"><span class="kick">ARTICLE</span><span class="dom">'+esc(host(r.url))+'</span><span class="meta">'+esc([r.source_name||'Press',r.year||null].filter(Boolean).join(' · '))+'</span></div>'+
      '<div class="mtitle art">'+esc(dispTitle(r))+'</div>'+
      '<div class="mact art"><a class="mopen" href="'+esc(r.url||'#')+'" target="_blank" rel="noopener">Open article '+ic('ext',11)+'</a>'+
      '<button class="mflag'+(isFlagged(r.url)?' on':'')+'" id="mFlag">'+ic('bookmark',15)+'<span>'+(isFlagged(r.url)?'Saved':'Bookmark')+'</span></button></div></div>'+
      '<div id="mArt"><iframe id="artFrame" class="art-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" src="/article-preview?url='+encodeURIComponent(r.url)+'"></iframe></div></div>';
  } else {
  if(vid&&isShort)main+='<div class="mplayer-wrap short"><div class="mplayer short"><iframe id="ytF" src="https://www.youtube.com/embed/'+vid+'?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>';
  else if(vid)main+='<div class="mplayer"><iframe id="ytF" src="https://www.youtube.com/embed/'+vid+'?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
  else main+='<div class="mhead" style="background:var(--ink)"><span style="font-size:26px">'+esc(ini(r.internal_author||'T'))+'</span><span style="font-size:12px">Internal team review</span></div>';
  main+='<div class="mtitle">'+esc(dispTitle(r))+(r.title_en?'<span class="mtitle-orig">'+esc(r.title)+(r.title_lang?' <em>('+esc(String(r.title_lang).toUpperCase())+')</em>':'')+'</span>':'')+'</div><div class="mmeta">'+esc(sub)+'</div>'+
    '<div class="mact">'+(isInternal?'':'<a class="mopen" href="'+esc(r.url||'#')+'" target="_blank" rel="noopener">Open on YouTube '+ic('ext',11)+'</a>')+
    '<button class="mflag'+(isFlagged(r.url)?' on':'')+'" id="mFlag">'+ic('bookmark',15)+'<span>'+(isFlagged(r.url)?'Saved':'Bookmark')+'</span></button></div>'+
    '<div class="mchips" id="mChips">'+chipsHTML(r)+'</div>'+
    '<div class="mphotos" id="mPhotos">'+photosHTML(r)+'</div>'+
    '<div class="mnotes"><div class="mn-h">Notes</div><div class="mn-list" id="mnList"></div><div class="mn-add"><input id="mnAuthor" class="mn-in" placeholder="Your name" maxlength="80"><textarea id="mnText" class="mn-ta" placeholder="Add a note for others to see…" maxlength="2000"></textarea><button class="mn-btn" id="mnAdd">Add note</button></div></div>'+
  '</div>';
  }
  let side=isArt?'':'<div class="mside'+(isShort?' short':'')+'">';
  if(isArt){
    // Articles show the piece itself in the main column; nothing video-related on the side.
  } else if(isShort){
    // Shorts: the clip as-is, plus its chapters and the whole transcript (not just IFE moments).
    const chaps=r.chapters||[];
    side+='<div class="sh">Chapters'+(chaps.some(c=>c.ife)?' <span class="ife-key">✦ IFE</span>':'')+'</div>';
    if(chaps.length)side+=chaps.map(ch=>'<div class="cap chap'+(ch.ife?' ife':'')+'" data-s="'+(ch.sec!=null?ch.sec:'')+'"><span class="cts">'+esc(ch.t||'')+'</span><span>'+(ch.ife?'✦ ':'')+esc(ch.title)+'</span></div>').join('');
    else side+='<div class="t11">No chapters on this Short.</div>';
    side+='<div class="sh" style="margin-top:16px">Transcript</div>';
    const caps=r.captions||[];
    if(caps.length)side+=caps.map(c=>{const en=c.text_en&&c.lang&&c.lang!=='en';const main=en?c.text_en:c.text;const orig=en?'<span class="cap-orig">'+esc(c.text)+' <em>('+esc((c.lang||'').toUpperCase())+')</em></span>':'';return '<div class="cap" data-s="'+(c.start_seconds!=null?c.start_seconds:'')+'"><span class="cts">'+esc(c.timestamp||'')+'</span><span>'+esc(main)+orig+'</span></div>';}).join('');
    else if(r.transcript_full_en||r.transcript_full||r.transcript_excerpt)side+='<div class="cap-all">'+esc(r.transcript_full_en||r.transcript_full||r.transcript_excerpt)+'</div>';
    else side+='<div class="t11">No transcript is available for this Short yet.</div>';
  } else if(isInternal){
    side+='<div class="sh">Review'+(r.internal_author?' — '+esc(r.internal_author):'')+'</div>';
    side+='<div style="font-size:12.5px;color:var(--ink2);line-height:1.65;white-space:pre-wrap">'+esc(r.internal_text||r.transcript_excerpt||'')+'</div>';
  } else {
  const chaps=r.chapters||[];
  if(chaps.length){
    side+='<div class="sh">Chapters'+(chaps.some(c=>c.ife)?' <span class="ife-key">✦ IFE</span>':'')+'</div>';
    side+=chaps.map(ch=>'<div class="cap chap'+(ch.ife?' ife':'')+'" data-s="'+(ch.sec!=null?ch.sec:'')+'"><span class="cts">'+esc(ch.t||'')+'</span><span>'+(ch.ife?'✦ ':'')+esc(ch.title)+'</span></div>').join('');
    side+='<div class="sh" style="margin-top:16px">Transcript — IFE moments</div>';
  } else {
    side+='<div class="sh">Transcript — IFE moments</div>';
  }
  const caps=(r.captions||[]).filter(c=>isIfeCap(c.text_en||c.text));
  if(caps.length)side+=caps.map(c=>{
    const en=c.text_en&&c.lang&&c.lang!=='en';
    const main=en?c.text_en:c.text;
    const orig=en?'<span class="cap-orig">'+esc(c.text)+' <em>('+esc((c.lang||'').toUpperCase())+')</em></span>':'';
    return '<div class="cap" data-s="'+(c.start_seconds!=null?c.start_seconds:'')+'"><span class="cts">'+esc(c.timestamp||'')+'</span><span>'+esc(main)+orig+'</span></div>';
  }).join('');
  else if(r.transcript_excerpt)side+='<div style="font-size:12px;color:var(--ink2);line-height:1.6">'+esc(r.transcript_excerpt)+'</div>';
  else side+='<div class="t11">No IFE-specific moments were extracted from this transcript.</div>';
  }
  if(!isArt)side+='</div>';
  $('mbody').innerHTML=main+side;$('mback').classList.add('show');document.body.style.overflow='hidden';
  const mf=$('mFlag');if(mf)mf.addEventListener('click',()=>{const on=toggleFlag(r);mf.classList.toggle('on',on);mf.querySelector('span').textContent=on?'Saved':'Bookmark';refreshFlagIcons();});
  $('mbody').querySelectorAll('.cap[data-s]').forEach(el=>el.addEventListener('click',()=>{const s=el.dataset.s,f=$('ytF');if(f&&s!=='')f.src='https://www.youtube.com/embed/'+vid+'?start='+s+'&autoplay=1';}));
  if(isArt)wireArticleFrame(r);
  renderModalNotes(r.url);
  wireSysEdit(r);
  wirePhotos(r);
  const au=$('mnAuthor');if(au)au.value=localStorage.getItem('rave-author')||'';
  const addBtn=$('mnAdd');
  if(addBtn)addBtn.addEventListener('click',async()=>{
    const author=($('mnAuthor').value||'').trim()||'Anonymous';
    const text=($('mnText').value||'').trim();if(!text)return;
    localStorage.setItem('rave-author',author);addBtn.disabled=true;
    try{
      const d=await (await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:r.url,author,text})})).json();
      if(d.status==='success'){S.notes[r.url]=d.notes;$('mnText').value='';renderModalNotes(r.url);toast('Note saved.');}
      else toast(d.error||'Could not save note.');
    }catch(e){toast('Network error.');}
    finally{addBtn.disabled=false;}
  });
}
function closeModal(){$('mback').classList.remove('show');$('mback').classList.remove('feat');document.body.style.overflow='';const f=$('ytF');if(f)f.src='';}

/* ── chat ── */
let CHAT_BUSY=false;
function openChat(){$('chat').classList.add('show');$('chatBack').classList.add('show');setTimeout(()=>$('chatInput').focus(),180);}
function closeChat(){$('chat').classList.remove('show');$('chatBack').classList.remove('show');}
function cScroll(){const b=$('chatBody');b.scrollTop=b.scrollHeight;}
function miniMd(s){let h=esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');const L=h.split(/\n/);let o='',ul=false;for(const ln of L){const t=ln.trim();if(/^[-*]\s+/.test(t)){if(!ul){o+='<ul>';ul=true;}o+='<li>'+t.replace(/^[-*]\s+/,'')+'</li>';}else{if(ul){o+='</ul>';ul=false;}if(t)o+='<p>'+t+'</p>';}}if(ul)o+='</ul>';return o||'<p></p>';}
function addUser(t){const e=$('chatEmpty');if(e)e.remove();const d=document.createElement('div');d.className='msg user';d.textContent=t;$('chatBody').appendChild(d);cScroll();}
function addTyping(){const d=document.createElement('div');d.className='msg bot';d.id='typing';d.innerHTML='<div class="bub"><div class="typing"><span></span><span></span><span></span></div></div>';$('chatBody').appendChild(d);cScroll();}
function addBot(a,src,err){const d=document.createElement('div');d.className='msg bot'+(err?' err':'');let h='<div class="bub">'+miniMd(a)+'</div>';if(src&&src.length){h+='<div class="msrc"><span class="sl">Sources ('+src.length+')</span>'+src.map((s,i)=>'<div class="src" data-u="'+esc(s.url)+'"><span class="sd">'+(i+1)+'</span><span class="stt">'+esc(s.title||'Untitled')+(s.ife_system?' · '+esc(s.ife_system):'')+(s.year?' · '+s.year:'')+'</span></div>').join('')+'</div>';}d.innerHTML=h;d.querySelectorAll('.src').forEach(x=>x.addEventListener('click',()=>{if(x.dataset.u)window.open(x.dataset.u,'_blank','noopener');}));$('chatBody').appendChild(d);cScroll();}
async function sendChat(){if(CHAT_BUSY)return;const inp=$('chatInput'),q=inp.value.trim();if(!q)return;addUser(q);inp.value='';inp.style.height='auto';CHAT_BUSY=true;$('chatSend').disabled=true;addTyping();
  try{const d=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})).json();$('typing')?.remove();if(d.status==='success')addBot(d.answer||'(no answer)',d.sources,false);else addBot(d.error||'Something went wrong.',null,true);}
  catch(e){$('typing')?.remove();addBot('Network error — '+e.message,null,true);}
  finally{CHAT_BUSY=false;$('chatSend').disabled=false;$('chatInput').focus();}}

/* ── init ── */
document.addEventListener('DOMContentLoaded',()=>{
  buildNav();
  $('crawlIc').innerHTML=ic('refresh',12);
  $('reportBtn').innerHTML=ic('doc',18);
  $('shareBtn').innerHTML=ic('share',18);
  $('bellBtn').innerHTML=ic('bookmark',18);
  $('crawlBtn').addEventListener('click',async()=>{await fetch('/api/ife-seed',{method:'POST'});toast('Crawl started in the background.');});
  $('shareBtn').addEventListener('click',()=>{if(navigator.clipboard)navigator.clipboard.writeText(location.href);toast('Shareable link copied.');});
  $('bellBtn').addEventListener('click',e=>{e.stopPropagation();toggleAlerts();});
  document.addEventListener('click',e=>{const p=$('alertPanel');if(!p.classList.contains('hide')&&!p.contains(e.target)&&!$('bellBtn').contains(e.target))p.classList.add('hide');});
  document.addEventListener('click',()=>document.querySelectorAll('#rf .fdd-p').forEach(p=>p.classList.add('hide')));
  $('mx').addEventListener('click',closeModal);
  $('mback').addEventListener('click',e=>{if(e.target===$('mback'))closeModal();});
  $('chatX').addEventListener('click',closeChat);
  $('chatBack').addEventListener('click',closeChat);
  $('chatSend').addEventListener('click',sendChat);
  const ci=$('chatInput');
  ci.addEventListener('input',()=>{ci.style.height='auto';ci.style.height=Math.min(ci.scrollHeight,120)+'px';});
  ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
  document.querySelectorAll('#chatSugg button').forEach(b=>b.addEventListener('click',()=>{ci.value=b.textContent;sendChat();}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('chat').classList.contains('show'))closeChat();else if($('mback').classList.contains('show'))closeModal();else if(!$('alertPanel').classList.contains('hide'))$('alertPanel').classList.add('hide');}});
  const startTab=restoreURL()||'Dashboard';
  Promise.all([loadNotes(),loadFlags()]).then(()=>{ setTab(startTab); refreshAlerts(); });
});
</script>
</body>
